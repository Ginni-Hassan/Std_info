<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Information System</title>
  <style>
    :root {
      --navy: #17253c;
      --blue: #2769d4;
      --blue-dark: #1955b4;
      --pale-blue: #edf4ff;
      --green: #1f9d67;
      --red: #d84b4b;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #dde4ee;
      --surface: #ffffff;
      --page: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    .app {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 28px 20px;
      color: white;
      background: var(--navy);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 34px;
      font-size: 20px;
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 10px;
      background: var(--blue);
      font-size: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      color: #dbe5f4;
      background: rgba(39, 105, 212, 0.35);
      font-weight: 700;
    }

    main {
      padding: 34px 42px 48px;
      min-width: 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 750;
      font-family: inherit;
      transition: 0.15s ease;
    }

    .btn-primary {
      color: white;
      background: var(--blue);
      box-shadow: 0 4px 12px rgba(39, 105, 212, 0.22);
    }

    .btn-primary:hover { background: var(--blue-dark); }
    .btn-secondary { color: #4b5563; background: #edf0f5; }
    .btn-danger { color: white; background: var(--red); }
    .btn-small { padding: 7px 10px; font-size: 13px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 16px;
    }

    .search {
      position: relative;
      width: min(380px, 100%);
    }

    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: white;
    }

    .search input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(39, 105, 212, 0.10);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 12px;
      color: var(--muted);
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(34, 48, 74, 0.05);
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 15px 16px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: #657187;
      background: #f8fafc;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    tbody tr:hover { background: #fafcff; }
    tbody tr:last-child td { border-bottom: 0; }
    td { font-size: 14px; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      color: var(--blue);
      background: var(--pale-blue);
    }

    .delete-btn {
      color: var(--red);
      background: #fff0f0;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
    }

    dialog {
      width: min(620px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(20, 31, 50, 0.24);
    }

    dialog::backdrop { background: rgba(23, 37, 60, 0.48); }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-header h2 { margin: 0; font-size: 20px; }

    .close-btn {
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 24px;
    }

    form { padding: 22px 24px 24px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: none;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(39, 105, 212, 0.10);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 13px 18px;
      border-radius: 8px;
      color: white;
      background: var(--navy);
      box-shadow: 0 10px 30px rgba(23, 37, 60, 0.22);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.25s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 780px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { padding: 16px 20px; }
      .brand { margin: 0 0 12px; }
      .nav-item { width: fit-content; }
      main { padding: 24px 18px; }
      .header { align-items: flex-start; gap: 16px; }
      .form-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .header { flex-direction: column; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .header .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <span>EduManager</span>
      </div>
      <div class="nav-item"><span>▦</span><span>Students</span></div>
    </aside>

    <main>
      <div class="header">
        <div>
          <h1>Student Information</h1>
          <p>Manage and review student records</p>
        </div>
        <button class="btn btn-primary" id="addStudentBtn">+ Add Student</button>
      </div>

      <div class="toolbar">
        <div class="search">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="Search students..." aria-label="Search students">
        </div>
        <div class="count" id="studentCount"></div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="id">#</th>
                <th data-sort="firstName">First Name</th>
                <th data-sort="lastName">Last Name</th>
                <th data-sort="phone">Phone</th>
                <th data-sort="email">Email</th>
                <th data-sort="university">University</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <dialog id="studentDialog">
    <div class="dialog-header">
      <h2 id="dialogTitle">Add Student</h2>
      <button class="close-btn" id="closeDialog" type="button" aria-label="Close">&times;</button>
    </div>
    <form id="studentForm">
      <input type="hidden" id="studentId">
      <div class="form-grid">
        <label>First name
          <input id="firstName" required maxlength="40" placeholder="First name">
        </label>
        <label>Last name
          <input id="lastName" required maxlength="40" placeholder="Last name">
        </label>
        <label>Phone
          <input id="phone" required maxlength="30" placeholder="Phone number">
        </label>
        <label>Email
          <input id="email" type="email" required maxlength="80" placeholder="student@email.com">
        </label>
        <label>University
          <input id="university" required maxlength="60" placeholder="University name">
        </label>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="cancelBtn" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit" id="saveBtn">Save Student</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const defaultStudents = [
      { id: 1, firstName: "Casha", lastName: "Nuux", phone: "334496", email: "casha@gmail.com", university: "UOH" },
      { id: 2, firstName: "Jamac", lastName: "Cabdi", phone: "32145", email: "jamac@gmail.com", university: "NEW GENERATION" },
      { id: 3, firstName: "Farah", lastName: "Warfa", phone: "44561", email: "farah@gmail.com", university: "AMOUD" },
      { id: 4, firstName: "Nuura", lastName: "Ahmed", phone: "345162", email: "nuura@gmail.com", university: "GOLIS" },
      { id: 5, firstName: "Hassan", lastName: "Ismail", phone: "698822", email: "hassan@gmail.com", university: "ADMAS" },
      { id: 6, firstName: "Mohamed", lastName: "Omar", phone: "4455668", email: "mohamed@gmail.com", university: "FFU" }
    ];

    let students = loadStudents();
    let sortKey = "id";
    let sortDirection = "asc";

    const rows = document.getElementById("studentRows");
    const searchInput = document.getElementById("searchInput");
    const dialog = document.getElementById("studentDialog");
    const form = document.getElementById("studentForm");
    const toast = document.getElementById("toast");

    function loadStudents() {
      try {
        const saved = JSON.parse(localStorage.getItem("students"));
        return Array.isArray(saved) ? saved : defaultStudents;
      } catch {
        return defaultStudents;
      }
    }

    function saveStudents() {
      localStorage.setItem("students", JSON.stringify(students));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = students.filter(student =>
        Object.values(student).some(value => String(value).toLowerCase().includes(query))
      );

      filtered.sort((a, b) => {
        const first = a[sortKey];
        const second = b[sortKey];
        const result = typeof first === "number"
          ? first - second
          : String(first).localeCompare(String(second), undefined, { numeric: true });
        return sortDirection === "asc" ? result : -result;
      });

      document.getElementById("studentCount").textContent =
        `${filtered.length} student${filtered.length === 1 ? "" : "s"}`;

      if (!filtered.length) {
        rows.innerHTML = '<tr><td class="empty" colspan="7">No students found.</td></tr>';
        return;
      }

      rows.innerHTML = filtered.map(student => `
        <tr>
          <td>${student.id}</td>
          <td>${escapeHtml(student.firstName)}</td>
          <td>${escapeHtml(student.lastName)}</td>
          <td>${escapeHtml(student.phone)}</td>
          <td>${escapeHtml(student.email)}</td>
          <td>${escapeHtml(student.university)}</td>
          <td>
            <div class="actions">
              <button class="btn btn-small edit-btn" type="button" data-action="edit" data-id="${student.id}">Edit</button>
              <button class="btn btn-small delete-btn" type="button" data-action="delete" data-id="${student.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function openForm(student = null) {
      form.reset();
      document.getElementById("studentId").value = student ? student.id : "";
      document.getElementById("dialogTitle").textContent = student ? "Edit Student" : "Add Student";

      if (student) {
        ["firstName", "lastName", "phone", "email", "university"].forEach(field => {
          document.getElementById(field).value = student[field];
        });
      }

      dialog.showModal();
      document.getElementById("firstName").focus();
    }

    function closeForm() {
      dialog.close();
    }

    document.getElementById("addStudentBtn").addEventListener("click", () => openForm());
    document.getElementById("closeDialog").addEventListener("click", closeForm);
    document.getElementById("cancelBtn").addEventListener("click", closeForm);
    searchInput.addEventListener("input", render);

    form.addEventListener("submit", event => {
      event.preventDefault();
      const idValue = document.getElementById("studentId").value;
      const record = {
        id: idValue ? Number(idValue) : Math.max(0, ...students.map(student => student.id)) + 1,
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        university: document.getElementById("university").value.trim()
      };

      if (idValue) {
        students = students.map(student => student.id === Number(idValue) ? record : student);
        showToast("Student updated successfully");
      } else {
        students.push(record);
        showToast("Student added successfully");
      }

      saveStudents();
      closeForm();
      render();
    });

    rows.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const student = students.find(item => item.id === id);

      if (button.dataset.action === "edit") {
        openForm(student);
      } else if (button.dataset.action === "delete") {
        if (confirm(`Delete ${student.firstName} ${student.lastName}?`)) {
          students = students.filter(item => item.id !== id);
          saveStudents();
          render();
          showToast("Student deleted");
        }
      }
    });

    document.querySelectorAll("th[data-sort]").forEach(header => {
      header.addEventListener("click", () => {
        const key = header.dataset.sort;
        sortDirection = sortKey === key && sortDirection === "asc" ? "desc" : "asc";
        sortKey = key;
        render();
      });
    });

    dialog.addEventListener("click", event => {
      if (event.target === dialog) closeForm();
    });

    render();
  </script>
</body>
</html>
